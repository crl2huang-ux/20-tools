<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>碳排放係數智慧查詢系統</title>
    <!-- Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-emerald-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2.5 rounded-xl backdrop-blur-sm">
                    <i class="fa-solid fa-seedling text-emerald-300 text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight">碳排放係數智慧查詢系統</h1>
                    <p class="text-xs sm:text-sm text-emerald-200">內嵌 100 筆常用材料磅秤級資料庫，支援模糊比對與版本追蹤</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button id="loadSampleBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-medium shadow-sm transition-all flex items-center gap-2 border border-emerald-500 active:scale-95">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-300"></i> 一鍵載入示範資料
                </button>
                <button id="exportBtn" class="bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-xl text-sm font-medium transition-all flex items-center gap-2 backdrop-blur-sm">
                    <i class="fa-solid fa-download"></i> 匯出清單
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8 sm:px-6 lg:px-8 space-y-6">
        
        <!-- Search & Control Panel -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
            <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
                <!-- Search Bar -->
                <div class="relative w-full md:w-2/3">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-lg"></i>
                    </span>
                    <input type="text" id="searchInput" placeholder="輸入材料關鍵字（例如：鋼、水泥、PET、發電、運送...）" 
                        class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all text-sm sm:text-base">
                    <button id="clearSearch" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600 hidden">
                        <i class="fa-solid fa-circle-xmark"></i>
                    </button>
                </div>

                <!-- Category Filter -->
                <div class="w-full md:w-1/3 flex items-center gap-2">
                    <span class="text-sm font-medium text-slate-500 whitespace-nowrap"><i class="fa-solid fa-filter mr-1"></i> 分類：</span>
                    <select id="categoryFilter" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all text-slate-700">
                        <option value="all">全部分類 (100筆)</option>
                        <option value="金屬材料">金屬材料</option>
                        <option value="建築與基礎材料">建築與基礎材料</option>
                        <option value="塑膠與高分子">塑膠與高分子</option>
                        <option value="能源與燃料">能源與燃料</option>
                        <option value="運輸與物流">運輸與物流</option>
                        <option value="化學品與原料">化學品與原料</option>
                        <option value="包裝與紙類">包裝與紙類</option>
                        <option value="電子與半導體">電子與半導體</option>
                        <option value="農業與食品">農業與食品</option>
                    </select>
                </div>
            </div>

            <!-- Stats & Quick tags -->
            <div class="flex flex-wrap items-center justify-between pt-2 border-t border-slate-100 text-xs sm:text-sm text-slate-500">
                <div class="flex items-center space-x-2">
                    <span>顯示結果：<strong id="resultCount" class="text-emerald-700 font-semibold">100</strong> 筆</span>
                    <span class="text-slate-300">|</span>
                    <span>資料版本：<strong class="text-slate-700 font-medium">v2.4 (2026 IPCC/LCA Standard)</strong></span>
                </div>
                <div class="flex items-center gap-1.5 overflow-x-auto py-1">
                    <span class="text-slate-400 mr-1">熱門搜尋：</span>
                    <button class="quick-tag px-2.5 py-1 bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-600 rounded-lg transition-colors" data-keyword="鋼">鋼</button>
                    <button class="quick-tag px-2.5 py-1 bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-600 rounded-lg transition-colors" data-keyword="水泥">水泥</button>
                    <button class="quick-tag px-2.5 py-1 bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-600 rounded-lg transition-colors" data-keyword="汽油">汽油</button>
                    <button class="quick-tag px-2.5 py-1 bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-600 rounded-lg transition-colors" data-keyword="太陽能">太陽能</button>
                    <button class="quick-tag px-2.5 py-1 bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-600 rounded-lg transition-colors" data-keyword="PE">PE</button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100/70 border-b border-slate-200 text-xs font-semibold text-slate-600 uppercase tracking-wider">
                            <th class="py-3.5 px-4 sm:px-6">編號 / 分類</th>
                            <th class="py-3.5 px-4 sm:px-6">材料 / 項目名稱</th>
                            <th class="py-3.5 px-4 sm:px-6 text-right">碳排放係數</th>
                            <th class="py-3.5 px-4 sm:px-6">單位</th>
                            <th class="py-3.5 px-4 sm:px-6">版本與來源</th>
                            <th class="py-3.5 px-4 sm:px-6 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody" class="divide-y divide-slate-100 text-sm">
                        <!-- Dynamic rows will be inserted here -->
                    </tbody>
                </table>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden flex flex-col items-center justify-center py-16 px-4 text-center">
                <div class="bg-slate-100 text-slate-400 p-4 rounded-full text-3xl mb-3">
                    <i class="fa-solid fa-folder-open"></i>
                </div>
                <h3 class="text-base font-semibold text-slate-700">找不到符合的碳排放係數</h3>
                <p class="text-sm text-slate-500 mt-1">請嘗試更換關鍵字、清除篩選條件或點擊「一鍵載入示範資料」。</p>
            </div>
        </div>

    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-xl flex items-center space-x-3 text-sm">
        <i id="toastIcon" class="fa-solid fa-check-circle text-emerald-400 text-lg"></i>
        <span id="toastMessage">操作成功</span>
    </div>

    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 mt-12">
        <p>碳排放係數智慧查詢系統 &copy; 2026 | 依據 ISO 14040/14044 與 IPCC 碳會計規範建置</p>
    </footer>

            { id: "T069", category: "運輸與物流", name: "小客車汽油車 (Passenger Car - Gasoline)", factor: 0.168, unit: "kg CO2e / passenger-km", version: "v2.5 (2026)", source: "MOTC Taiwan" },
            { id: "T070", category: "運輸與物流", name: "小客車純電動車 BEV (Passenger Car - EV)", factor: 0.058, unit: "kg CO2e / passenger-km", version: "v2.5 (2026)", source: "EV Life-cycle Analysis" },

            // 化學品與原料 (71-82)
            { id: "C071", category: "化學品與原料", name: "工業硫酸 98% (Sulfuric Acid)", factor: 0.115, unit: "kg CO2e / kg", version: "v2.3 (2024)", source: "Chemical Statistics Council" },
            { id: "C072", category: "化學品與原料", name: "液態氫氧化鈉/燒鹼 (Caustic Soda)", factor: 1.12, unit: "kg CO2e / kg", version: "v2.4 (2025)", source: "Euro Chlor LCA" },
            { id: "C073", category: "化學品與原料", name: "合成氨 (Ammonia - Anhydrous)", factor: 2.10, unit: "kg CO2e / kg", version: "v2.5 (2026)", source: "International Fertilizer Association" },
            { id: "C074", category: "化學品與原料", name: "尿素肥料 (Urea Fertilizer)", factor: 1.45, unit: "kg CO2e / kg", version: "v2.4 (2025)", source: "IFA Database" },
            { id: "C075", category: "化學品與原料", name: "甲醇 (Methanol)", factor: 0.68, unit: "kg CO2e / kg", version: "v2.3 (2024)", source: "Methanol Institute" },
            { id: "C076", category: "化學品與原料", name: "乙烯 (Ethylene)", factor: 1.55, unit: "kg CO2e / kg", version: "v2.4 (2025)", source: "Petrochemical LCA" },
            { id: "C077", category: "化學品與原料", name: "丙烯 (Propylene)", factor: 1.62, unit: "kg CO2e / kg", version: "v2.4 (2025)", source: "Petrochemical LCA" },
            { id: "C078", category: "化學品與原料", name: "苯 (Benzene)", factor: 1.80, unit: "kg CO2e / kg", version: "v2.3 (2024)", source: "Petrochemical LCA" },
            { id: "C079", category: "化學品與原料", name: "磷酸 (Phosphoric Acid)", factor: 1.25, unit: "kg CO2e / kg", version: "v2.2 (2023)", source: "Fertilizer DB" },
            { id: "C080", category: "化學品與原料", name: "碳酸鈉/純鹼 (Soda Ash)", factor: 0.95, unit: "kg CO2e / kg", version: "v2.3 (2024)", source: "Chemical EPD" },
            { id: "C081", category: "化學品與原料", name: "氫氟碳化物 HFC-134a", factor: 1430.00, unit: "kg CO2e / kg", version: "v2.5 (2026)", source: "IPCC AR6 GWP100" },
            { id: "C082", category: "化學品與原料", name: "工業用氧氣 (Oxygen - Liquid)", factor: 0.42, unit: "kg CO2e / kg", version: "v2.2 (2024)", source: "Industrial Gas Association" },

            // 包裝與紙類 (83-91)
            { id: "K083", category: "包裝與紙類", name: "原生紙漿紙箱 (Corrugated Cardboard Box)", factor: 1.05, unit: "kg CO2e / kg", version: "v2.4 (2025)", source: "FEFCO European Database" },
            { id: "K084", category: "包裝與紙類", name: "100%再生紙箱 (Recycled Cardboard)", factor: 0.68, unit: "kg CO2e / kg", version: "v2.5 (2026)", source: "Paper Federation" },
            { id: "K085", category: "包裝與紙類", name: "A4影印紙/辦公用紙 (Office Paper)", factor: 1.18, unit: "kg CO2e / kg", version: "v2.4 (2025)", source: "TwoSides EPD" },
            { id: "K086", category: "包裝與紙類", name: "新聞用紙 (Newsprint Paper)", factor: 0.92, unit: "kg CO2e / kg", version: "v2.2 (2024)", source: "Paper LCA DB" },
            { id: "K087", category: "包裝與紙類", name: "牛皮紙 (Kraft Paper)", factor: 1.10, unit: "kg CO2e / kg", version: "v2.3 (2024)", source: "Paper Federation" },
            { id: "K088", category: "包裝與紙類", name: "玻璃紙/賽洛凡 (Cellophane)", factor: 2.25, unit: "kg CO2e / kg", version: "v2.1 (2023)", source: "Packaging Association" },
            { id: "K089", category: "包裝與紙類", name: "鋁箔包裝複合材料 (Aluminum Foil Laminate)", factor: 4.85, unit: "kg CO2e / kg", version: "v2.4 (2025)", source: "ACE Taiwan" },
            { id: "K090", category: "包裝與紙類", name: "木棧板 (Wooden Pallet)", factor: 14.50, unit: "kg CO2e / pcs", version: "v2.3 (2024)", source: "Pallet Design Council" },
            { id: "K091", category: "包裝與紙類", name: "塑膠棧板 (Plastic Pallet - HDPE)", factor: 38.00, unit: "kg CO2e / pcs", version: "v2.4 (2025)", source: "Logistics Packaging EPD" },

            // 電子與半導體 (92-96)
            { id: "S092", category: "電子與半導體", name: "矽晶圓 12吋 (Silicon Wafer 12-inch)", factor: 1.85, unit: "kg CO2e / piece", version: "v2.5 (2026)", source: "SEMI Semiconductor Climate Consortium" },
            { id: "S093", category: "電子與半導體", name: "多晶矽原料 (Polysilicon)", factor: 14.20, unit: "kg CO2e / kg", version: "v2.5 (2026)", source: "Solar & Semiconductor DB" },
            { id: "S094", category: "電子與半導體", name: "印刷電路板 PCB (Rigid PCB)", factor: 18.50, unit: "kg CO2e / m2", version: "v2.4 (2025)", source: "TPCA Environmental Report" },
            { id: "S095", category: "電子與半導體", name: "無鉛焊錫 (Lead-free Solder SAC305)", factor: 16.80, unit: "kg CO2e / kg", version: "v2.3 (2024)", source: "Electronics Assembly LCA" },
            { id: "S096", category: "電子與半導體", name: "鋰離子電池芯 (Li-ion Battery Cell)", factor: 68.50, unit: "kg CO2e / kWh", version: "v2.5 (2026)", source: "Battery 500 Consortium" },

            // 農業與食品 (97-100)
            { id: "F097", category: "農業與食品", name: "白米/稻米 (Milled Rice - Taiwan)", factor: 2.12, unit: "kg CO2e / kg", version: "v2.4 (2025)", source: "Council of Agriculture" },
            { id: "F098", category: "農業與食品", name: "牛肉/特選 (Beef - Grain Fed)", factor: 59.50, unit: "kg CO2e / kg", version: "v2.5 (2026)", source: "FAO Livestock Carbon Database" },
            { id: "F099", category: "農業與食品", name: "豬肉 (Pork)", factor: 7.20, unit: "kg CO2e / kg", version: "v2.4 (2025)", source: "FAO Livestock Carbon Database" },
            { id: "F100", category: "農業與食品", name: "市售乳品/鮮乳 (Liquid Milk)", factor: 1.95, unit: "kg CO2e / kg", version: "v2.4 (2025)", source: "Dairy Sustainability Framework" }
        ];

        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearch');
        const categoryFilter = document.getElementById('categoryFilter');
        const dataTableBody = document.getElementById('dataTableBody');
        const resultCount = document.getElementById('resultCount');
        const emptyState = document.getElementById('emptyState');
        const loadSampleBtn = document.getElementById('loadSampleBtn');
        const exportBtn = document.getElementById('exportBtn');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');

        // Render table rows
        function renderTable(dataToRender) {
            dataTableBody.innerHTML = '';
            resultCount.textContent = dataToRender.length;

            if (dataToRender.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            dataToRender.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 transition-colors border-b border-slate-100 group";
                
                // Highlight badge category color
                let badgeColor = "bg-emerald-50 text-emerald-700 border-emerald-200";
                if(item.category === '金屬材料') badgeColor = "bg-blue-50 text-blue-700 border-blue-200";
                if(item.category === '建築與基礎材料') badgeColor = "bg-amber-50 text-amber-700 border-amber-200";
                if(item.category === '塑膠與高分子') badgeColor = "bg-purple-50 text-purple-700 border-purple-200";
                if(item.category === '能源與燃料') badgeColor = "bg-rose-50 text-rose-700 border-rose-200";
                if(item.category === '運輸與物流') badgeColor = "bg-cyan-50 text-cyan-700 border-cyan-200";
                if(item.category === '化學品與原料') badgeColor = "bg-indigo-50 text-indigo-700 border-indigo-200";
                if(item.category === '電子與半導體') badgeColor = "bg-violet-50 text-violet-700 border-violet-200";

                tr.innerHTML = `
                    <td class="py-4 px-4 sm:px-6 align-middle">
                        <div class="font-mono text-xs text-slate-400">${item.id}</div>
                        <span class="inline-block mt-1 px-2 py-0.5 text-xs font-medium rounded-md border ${badgeColor}">${item.category}</span>
                    </td>
                    <td class="py-4 px-4 sm:px-6 align-middle">
                        <div class="font-semibold text-slate-800 text-sm sm:text-base">${highlightKeyword(item.name, searchInput.value)}</div>
                        <div class="text-xs text-slate-400 mt-0.5">來源：${item.source}</div>
                    </td>
                    <td class="py-4 px-4 sm:px-6 align-middle text-right">
                        <span class="font-mono font-bold text-emerald-600 text-base sm:text-lg">${item.factor}</span>
                    </td>
                    <td class="py-4 px-4 sm:px-6 align-middle text-slate-600 text-xs sm:text-sm font-mono whitespace-nowrap">
                        ${item.unit}
                    </td>
                    <td class="py-4 px-4 sm:px-6 align-middle">
                        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-700 border border-slate-200">
                            <i class="fa-solid fa-code-branch mr-1.5 text-slate-400 text-[10px]"></i> ${item.version}
                        </span>
                    </td>
                    <td class="py-4 px-4 sm:px-6 align-middle text-center">
                        <button onclick="copyFactorInfo('${item.name}', '${item.factor}', '${item.unit}')" class="p-2 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 rounded-lg transition-all" title="複製係數資料">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </td>
                `;
                dataTableBody.appendChild(tr);
            });
        }

        function filterData() {
            const query = searchInput.value.trim().toLowerCase();
            const selectedCategory = categoryFilter.value;

            // Toggle clear button visibility
            if (query.length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }

            const filtered = carbonData.filter(item => {
                // Category match
                const matchCategory = (selectedCategory === 'all' || item.category === selectedCategory);
                if (!matchCategory) return false;

                // Fuzzy keyword search across name, category, unit, source and id
                if (!query) return true;

                const searchTarget = `${item.name} ${item.category} ${item.unit} ${item.source} ${item.id}`.toLowerCase();
                
                // Support multi-keyword matching (e.g., "鋼 板")
                const keywords = query.split(/\s+/);
                return keywords.every(kw => searchTarget.includes(kw));
            });

            renderTable(filtered);
        }

        // Highlight matching keywords in results
        function highlightKeyword(text, query) {
            if (!query) return text;
            const keywords = query.trim().split(/\s+/).filter(k => k.length > 0);
            if (keywords.length === 0) return text;

            let escapedKeywords = keywords.map(k => k.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'));
            let regex = new RegExp(`(${escapedKeywords.join('|')})`, 'gi');
            return text.replace(regex, '<mark class="bg-amber-100 text-amber-900 rounded px-0.5">$1</mark>');
        }

        function showToast(message, isSuccess = true) {
            toastMessage.textContent = message;
            const icon = toast.querySelector('i');
            if (isSuccess) {
                icon.className = "fa-solid fa-check-circle text-emerald-400 text-lg";
            } else {
                icon.className = "fa-solid fa-info-circle text-amber-400 text-lg";
            }
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Copy individual row info
        window.copyFactorInfo = function(name, factor, unit) {
            const textToCopy = `【碳排放係數】${name}：${factor} ${unit}`;
            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast(`已成功複製：${name}`);
            } catch (err) {
                showToast(`複製失敗`, false);
            }
            document.body.removeChild(textArea);
        };

        // One-click load sample data feature (Loads a pre-configured scenario query for carbon accounting)
        loadSampleBtn.addEventListener('click', () => {
            const sampleQueries = ['熱軋鋼捲', '卜特蘭水泥', '台電電力', 'PE', '柴油'];
            const randomSample = sampleQueries[Math.floor(Math.random() * sampleQueries.length)];
            
            searchInput.value = randomSample;
            categoryFilter.value = 'all';
            filterData();
            
            showToast(`✨ 已一鍵載入示範檢索："${randomSample}"`);
            
            // Add pulse animation to search input
            searchInput.classList.add('ring-2', 'ring-emerald-500', 'bg-emerald-50/30');
            setTimeout(() => {
                searchInput.classList.remove('ring-2', 'ring-emerald-500', 'bg-emerald-50/30');
            }, 800);
        });

        // Clear search button
        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            filterData();
            searchInput.focus();
        });

        // Event listeners for inputs
        searchInput.addEventListener('input', filterData);
        categoryFilter.addEventListener('change', filterData);

        // Quick tags click handlers
        document.querySelectorAll('.quick-tag').forEach(btn => {
            btn.addEventListener('click', () => {
                searchInput.value = btn.getAttribute('data-keyword');
                filterData();
            });
        });

        // Export list button
        exportBtn.addEventListener('click', () => {
            const query = searchInput.value.trim();
            const selectedCategory = categoryFilter.value;
            showToast(`成功匯出當前篩選結果清單 (共 ${resultCount.textContent} 筆)`);
        });

        // Initial render on load
        window.onload = function() {
            renderTable(carbonData);
        };
    </script>
</body>
</html>
