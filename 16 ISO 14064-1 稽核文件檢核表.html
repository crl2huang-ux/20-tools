<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISO 14064-1 溫室氣體盤查稽核文件檢核表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-emerald-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold flex items-center gap-3">
                    <i class="fa-solid fa-clipboard-check text-emerald-300"></i> ISO 14064-1 稽核文件檢核表
                </h1>
                <p class="text-emerald-100 text-sm mt-1">盤查類別、排放源追溯與佐證文件完整性自動計算系統</p>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="loadSampleData()" class="bg-amber-500 hover:bg-amber-600 text-white font-medium px-4 py-2 rounded-xl shadow transition duration-200 flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> 一鍵載入示範資料
                </button>
                <button onclick="addRow()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded-xl shadow transition duration-200 flex items-center gap-2 text-sm border border-emerald-500">
                    <i class="fa-solid fa-plus"></i> 新增排放源
                </button>
                <button onclick="exportCSV()" class="bg-slate-800 hover:bg-slate-700 text-white font-medium px-4 py-2 rounded-xl shadow transition duration-200 flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-download"></i> 匯出報表
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-500">總排放源數量</p>
                    <h3 id="stat-total" class="text-3xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-industry"></i>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-500">文件完全備齊項目</p>
                    <h3 id="stat-complete" class="text-3xl font-bold text-emerald-600 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-file-circle-check"></i>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 md:col-span-2 flex flex-col justify-center">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-medium text-slate-600">整體佐證文件完整率</span>
                    <span id="stat-rate" class="text-lg font-bold text-emerald-700">0%</span>
                </div>
                <div class="w-full bg-slate-100 h-4 rounded-full overflow-hidden p-0.5 border border-slate-200">
                    <div id="progress-bar" class="bg-emerald-600 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 md:p-6 border-b border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4 bg-slate-50/50">
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <div class="relative w-full md:w-80">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </span>
                        <input type="text" id="searchInput" oninput="renderTable()" placeholder="搜尋排放源名稱或設施..." class="w-full pl-10 pr-4 py-2 bg-white border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <select id="categoryFilter" onchange="renderTable()" class="bg-white border border-slate-300 text-slate-700 text-sm rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="">所有盤查類別</option>
                        <option value="類別 1: 直接溫室氣體排放">類別 1: 直接排放</option>
                        <option value="類別 2: 輸入電力間接排放">類別 2: 輸入電力</option>
                        <option value="類別 3: 運輸間接排放">類別 3: 運輸排放</option>
                        <option value="類別 4: 組織使用產品之排放">類別 4: 產品排放</option>
                    </select>
                </div>
                <div class="text-xs text-slate-500 flex items-center gap-2">
                    <span class="inline-block w-3 h-3 bg-emerald-100 border border-emerald-300 rounded"></span> 勾選憑證自動計算完整率
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100/70 text-slate-600 text-xs font-semibold uppercase tracking-wider border-b border-slate-200">
                            <th class="py-4 px-4">項次 / 類別</th>
                            <th class="py-4 px-4">排放源名稱 / 設施</th>
                            <th class="py-4 px-4 text-center">電費單</th>
                            <th class="py-4 px-4 text-center">發票 / 收據</th>
                            <th class="py-4 px-4 text-center">磅單 / 數據紀錄</th>
                            <th class="py-4 px-4 text-center">個別完整率</th>
                            <th class="py-4 px-4">稽核備註</th>
                            <th class="py-4 px-4 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="checklistTableBody" class="divide-y divide-slate-200 text-sm">
                        <!-- Javascript will inject rows here -->
                    </tbody>
                </table>
            </div>
            
            <div id="emptyState" class="hidden text-center py-12">
                <div class="text-slate-300 text-5xl mb-3"><i class="fa-solid fa-folder-open"></i></div>
                <p class="text-slate-500 font-medium">目前沒有符合條件的排放源資料</p>
                <button onclick="loadSampleData()" class="mt-3 text-emerald-600 hover:text-emerald-700 text-sm font-semibold">點此載入示範資料</button>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-6 mt-12 text-center text-slate-500 text-sm">
        <p>ISO 14064-1:2018 溫室氣體盤查文件管理與確信查證輔助工具</p>
    </footer>

    <!-- Custom Notification / Message Box -->
    <div id="messageModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl border border-slate-100 text-center">
            <div id="modalIcon" class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
                <i class="fa-solid fa-check"></i>
            </div>
            <h3 id="modalTitle" class="text-lg font-bold text-slate-800 mb-1">通知</h3>
            <p id="modalText" class="text-slate-600 text-sm mb-6">訊息內容...</p>
            <button onclick="closeModal()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-xl transition shadow">確定</button>
        </div>
    </div>

    <script>
        // Initial state data
        let auditData = [];

        // Sample demo data for ISO 14064-1 verification
        const sampleData = [
            {
                id: 1,
                category: "類別 2: 輸入電力間接排放",
                sourceName: "總管理處大樓 (1F-8F)",
                hasElectricity: true,
                hasInvoice: true,
                hasScale: false,
                note: "台電月結電費單齊全，已核對總用電度數。"
            },
            {
                id: 2,
                category: "類別 1: 直接溫室氣體排放",
                sourceName: "廠區柴油發電機 (緊急備用)",
                hasElectricity: false,
                hasInvoice: true,
                hasScale: true,
                note: "附有購油發票及每次加油磅單/油量計紀錄。"
            },
            {
                id: 3,
                category: "類別 1: 直接溫室氣體排放",
                sourceName: "公務汽油小客車 (車號 ABC-1234)",
                hasElectricity: false,
                hasInvoice: true,
                hasScale: false,
                note: "中油加油站電子發票與里程記錄本備查。"
            },
            {
                id: 4,
                category: "類別 1: 直接溫室氣體排放",
                sourceName: "食堂天然氣 (LPG/LNG) 鍋爐",
                hasElectricity: false,
                hasInvoice: true,
                hasScale: true,
                note: "瓦斯行進貨磅單及統一發票。"
            },
            {
                id: 5,
                category: "類別 3: 運輸間接排放",
                sourceName: "員工通勤交通車 (外包)",
                hasElectricity: false,
                hasInvoice: false,
                hasScale: false,
                note: "尚缺合約及每月油料發票證明文件。"
            },
            {
                id: 6,
                category: "類別 2: 輸入電力間接排放",
                sourceName: "一廠生產車間變壓器",
                hasElectricity: true,
                hasInvoice: true,
                hasScale: false,
                note: "工業用電電費單與繳費收據完整。"
            }
        ];

        // Initialize application on load
        window.onload = function() {
            // Load initial sample data directly so table isn't empty
            auditData = [...sampleData];
            renderTable();
        };

        // Load Sample Data Handler
        function loadSampleData() {
            auditData = [...sampleData];
            renderTable();
            showModal("載入成功", "已成功載入 ISO 14064-1 示範排放源與佐證文件稽核清單！", "success");
        }

        // Add new blank row
        function addRow() {
            const newId = auditData.length > 0 ? Math.max(...auditData.map(item => item.id)) + 1 : 1;
            auditData.unshift({
                id: newId,
                category: "類別 1: 直接溫室氣體排放",
                sourceName: "新排放源 (請輸入名稱)",
                hasElectricity: false,
                hasInvoice: false,
                hasScale: false,
                note: ""
            });
            renderTable();
        }

        // Delete row
        function deleteRow(id) {
            auditData = auditData.filter(item => item.id !== id);
            renderTable();
        }

        // Update item property when edited or checked
        function updateItem(id, field, value) {
            const item = auditData.find(i => i.id === id);
            if (item) {
                item[field] = value;
                renderTable(false); // Re-render without resetting focus if possible, or simple re-render
            }
        }

        // Render Table and update metrics
        function renderTable(updateStatsOnly = false) {
            const tbody = document.getElementById('checklistTableBody');
            const searchInput = document.getElementById('searchInput').value.toLowerCase();
            const categoryFilter = document.getElementById('categoryFilter').value;
            const emptyState = document.getElementById('emptyState');

            // Filter data
            const filteredData = auditData.filter(item => {
                const matchesSearch = item.sourceName.toLowerCase().includes(searchInput) || item.note.toLowerCase().includes(searchInput);
                const matchesCategory = categoryFilter === "" || item.category === categoryFilter;
                return matchesSearch && matchesCategory;
            });

            // Calculate statistics across ALL data (not just filtered)
            let totalCount = auditData.length;
            let completeCount = 0;
            let totalScoreSum = 0;

            auditData.forEach(item => {
                let checks = (item.hasElectricity ? 1 : 0) + (item.hasInvoice ? 1 : 0) + (item.hasScale ? 1 : 0);
                let rate = (checks / 3) * 100;
                totalScoreSum += rate;
                if (rate === 100) completeCount++;
            });

            const overallRate = totalCount > 0 ? Math.round(totalScoreSum / totalCount) : 0;

            // Update DOM Statistics
            document.getElementById('stat-total').innerText = totalCount;
            document.getElementById('stat-complete').innerText = completeCount;
            document.getElementById('stat-rate').innerText = overallRate + '%';
            document.getElementById('progress-bar').style.width = overallRate + '%';

            if (filteredData.length === 0) {
                tbody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            let html = '';
            filteredData.forEach((item, index) => {
                // Calculate individual rate
                let checks = (item.hasElectricity ? 1 : 0) + (item.hasInvoice ? 1 : 0) + (item.hasScale ? 1 : 0);
                let indRate = Math.round((checks / 3) * 100);
                
                let badgeColor = "bg-rose-50 text-rose-700 border-rose-200";
                if (indRate === 100) badgeColor = "bg-emerald-50 text-emerald-700 border-emerald-200";
                else if (indRate > 0) badgeColor = "bg-amber-50 text-amber-700 border-amber-200";

                html += `
                    <tr class="hover:bg-slate-50/80 transition duration-150 border-b border-slate-100">
                        <td class="py-4 px-4 align-top">
                            <span class="text-xs font-semibold text-slate-400">#${item.id}</span>
                            <select onchange="updateItem(${idNumber(item.id)}, 'category', this.value)" class="mt-1 text-xs bg-slate-100 border border-slate-200 rounded-lg p-1 text-slate-700 font-medium w-full focus:outline-none focus:ring-1 focus:ring-emerald-500">
                                <option value="類別 1: 直接溫室氣體排放" ${item.category.includes('類別 1') ? 'selected' : ''}>類別 1: 直接排放</option>
                                <option value="類別 2: 輸入電力間接排放" ${item.category.includes('類別 2') ? 'selected' : ''}>類別 2: 輸入電力</option>
                                <option value="類別 3: 運輸間接排放" ${item.category.includes('類別 3') ? 'selected' : ''}>類別 3: 運輸排放</option>
                                <option value="類別 4: 組織使用產品之排放" ${item.category.includes('類別 4') ? 'selected' : ''}>類別 4: 產品排放</option>
                            </select>
                        </td>
                        <td class="py-4 px-4 align-top">
                            <input type="text" value="${escapeHtml(item.sourceName)}" onchange="updateItem(${item.id}, 'sourceName', this.value)" class="font-medium text-slate-800 bg-transparent border-b border-transparent hover:border-slate-300 focus:border-emerald-500 focus:outline-none w-full py-1">
                        </td>
                        <td class="py-4 px-4 text-center align-middle">
                            <label class="cursor-pointer inline-flex items-center justify-center p-2 rounded-xl hover:bg-slate-100 transition">
                                <input type="checkbox" ${item.hasElectricity ? 'checked' : ''} onchange="updateItem(${item.id}, 'hasElectricity', this.checked)" class="w-5 h-5 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500">
                            </label>
                        </td>
                        <td class="py-4 px-4 text-center align-middle">
                            <label class="cursor-pointer inline-flex items-center justify-center p-2 rounded-xl hover:bg-slate-100 transition">
                                <input type="checkbox" ${item.hasInvoice ? 'checked' : ''} onchange="updateItem(${item.id}, 'hasInvoice', this.checked)" class="w-5 h-5 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500">
                            </label>
                        </td>
                        <td class="py-4 px-4 text-center align-middle">
                            <label class="cursor-pointer inline-flex items-center justify-center p-2 rounded-xl hover:bg-slate-100 transition">
                                <input type="checkbox" ${item.hasScale ? 'checked' : ''} onchange="updateItem(${item.id}, 'hasScale', this.checked)" class="w-5 h-5 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500">
                            </label>
                        </td>
                        <td class="py-4 px-4 text-center align-middle">
                            <span class="inline-block px-2.5 py-1 rounded-full text-xs font-bold border ${badgeColor}">
                                ${indRate}%
                            </span>
                        </td>
                        <td class="py-4 px-4 align-top">
                            <input type="text" value="${escapeHtml(item.note)}" placeholder="填寫查證備註..." onchange="updateItem(${item.id}, 'note', this.value)" class="text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-600 w-full focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </td>
                        <td class="py-4 px-4 text-center align-middle">
                            <button onclick="deleteRow(${item.id})" class="text-slate-400 hover:text-rose-600 p-2 rounded-xl hover:bg-rose-50 transition" title="刪除排放源">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        // Helper for ID mapping
        function idNumber(id) { return id; }

        // Escape HTML to prevent injection
        function escapeHtml(text) {
            return text.replace(/"/g, '&quot;').replace(ى => '&#39;');
        }

        // Modal Helpers
        function showModal(title, text, type = 'success') {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalText').innerText = text;
            const iconDiv = document.getElementById('modalIcon');
            if (type === 'success') {
                iconDiv.className = "w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-xl";
                iconDiv.innerHTML = '<i class="fa-solid fa-check"></i>';
            } else {
                iconDiv.className = "w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-xl";
                iconDiv.innerHTML = '<i class="fa-solid fa-info"></i>';
            }
            document.getElementById('messageModal').classList.remove('hidden');
            document.getElementById('messageModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('messageModal').classList.remove('flex');
            document.getElementById('messageModal').classList.add('hidden');
        }

        // Export report to CSV
        function exportCSV() {
            if (auditData.length === 0) {
                showModal('提示', '目前沒有資料可供匯出。', 'info');
                return;
            }

            let csvContent = "\uFEFF項次,盤查類別,排放源名稱,電費單,發票收據,磅單紀錄,完整率,備註\n";
            auditData.forEach(item => {
                let checks = (item.hasElectricity ? 1 : 0) + (item.hasInvoice ? 1 : 0) + (item.hasScale ? 1 : 0);
                let rate = Math.round((checks / 3) * 100) + '%';
                csvContent += `${item.id},"${item.category}","${item.sourceName}",${item.hasElectricity ? '有' : '無'},${item.hasInvoice ? '有' : '無'},${item.hasScale ? '有' : '無'},${rate},"${item.note}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `ISO14064_稽核文件檢核表_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
