<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電力排碳分析工具</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for interactive charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white shadow-md py-6 px-4 md:px-8">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold flex items-center gap-3">
                    <i class="fa-solid fa-leaf text-emerald-300"></i> 電力排碳分析工具
                </h1>
                <p class="text-emerald-100 text-sm mt-1">計算每月用電碳排放量，協助企業與個人進行碳盤查與節能管理</p>
            </div>
            <div class="flex items-center gap-3">
                <!-- Demo Data Button -->
                <button id="loadDemoBtn" class="bg-white/10 hover:bg-white/20 text-white border border-white/30 text-sm font-medium py-2 px-4 rounded-xl transition duration-200 flex items-center gap-2 shadow-sm backdrop-blur-sm cursor-pointer">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-300"></i> 一鍵載入示範資料
                </button>
                <!-- Reset Button -->
                <button id="resetBtn" class="bg-red-500/20 hover:bg-red-500/30 text-white border border-red-400/30 text-sm font-medium py-2 px-4 rounded-xl transition duration-200 flex items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-rotate-right"></i> 清空重設
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 md:px-8 py-8 flex-grow w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Settings & Input Form (5 Cols) -->
        <div class="lg:col-span-5 space-y-6">
            
            <!-- Coefficient Selection Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-emerald-600"></i> 係數與設定
                </h2>
                <div class="space-y-4">
                    <div>
                        <label for="yearSelect" class="block text-sm font-medium text-slate-700 mb-1">選擇電力排碳係數年份</label>
                        <select id="yearSelect" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
                            <!-- Options will be populated by JS -->
                        </select>
                        <p id="coefficientInfo" class="text-xs text-slate-500 mt-2 flex items-center gap-1.5">
                            <i class="fa-solid fa-circle-info text-emerald-600"></i> <span>請選擇對應年份的官方公告係數</span>
                        </p>
                    </div>
                </div>
            </div>

            <!-- Monthly Electricity Input Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-bolt text-amber-500"></i> 12 個月用電度數 (kWh)
                    </h2>
                    <span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg font-medium">單位：度</span>
                </div>
                
                <div class="grid grid-cols-2 gap-3 max-h-[420px] overflow-y-auto pr-1" id="inputsContainer">
                    <!-- Inputs generated via JS -->
                </div>
            </div>

        </div>

        <!-- Right Column: Dashboard & Chart (7 Cols) -->
        <div class="lg:col-span-7 space-y-6">
            
            <!-- Summary Statistics Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col justify-between">
                    <div class="text-slate-500 text-xs font-medium uppercase tracking-wider">年度總用電量</div>
                    <div class="mt-2 flex items-baseline gap-1">
                        <span id="totalKwh" class="text-2xl font-bold text-slate-900">0</span>
                        <span class="text-xs text-slate-500">kWh</span>
                    </div>
                    <div class="mt-2 text-xs text-emerald-600 flex items-center gap-1 font-medium">
                        <i class="fa-solid fa-chart-line"></i> 12個月累計
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col justify-between">
                    <div class="text-slate-500 text-xs font-medium uppercase tracking-wider">年度總碳排放量</div>
                    <div class="mt-2 flex items-baseline gap-1">
                        <span id="totalCarbon" class="text-2xl font-bold text-emerald-600">0.00</span>
                        <span class="text-xs text-slate-500">kg $CO_2e$</span>
                    </div>
                    <div class="mt-2 text-xs text-slate-500 flex items-center gap-1">
                        約當 <span id="totalCarbonTon" class="font-semibold text-slate-700">0.00</span> 公噸
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col justify-between">
                    <div class="text-slate-500 text-xs font-medium uppercase tracking-wider">每月平均排放</div>
                    <div class="mt-2 flex items-baseline gap-1">
                        <span id="avgCarbon" class="text-2xl font-bold text-slate-700">0.00</span>
                        <span class="text-xs text-slate-500">kg $CO_2e$</span>
                    </div>
                    <div class="mt-2 text-xs text-slate-500 flex items-center gap-1">
                        平均每月用電 <span id="avgKwh" class="font-semibold text-slate-700">0</span> kWh
                    </div>
                </div>
            </div>

            <!-- Chart Container Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-2">
                    <div>
                        <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-chart-area text-teal-600"></i> 每月碳排放折線趨勢圖
                        </h2>
                        <p class="text-xs text-slate-500 mt-0.5">單位：公斤二氧化碳當量 ($kg\ CO_2e$)</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="inline-block w-3 h-3 rounded-full bg-emerald-500"></span>
                        <span class="text-xs text-slate-600 font-medium">碳排量 ($kg$)</span>
                    </div>
                </div>
                
                <div class="relative w-full h-[320px]">
                    <canvas id="carbonChart"></canvas>
                </div>
            </div>

        </div>

    </main>

    <footer class="bg-white border-t border-slate-200 py-4 px-4 text-center text-xs text-slate-500 mt-auto">
        <p>電力排碳分析工具 &copy; 2026 | 依據官方電力排碳係數進行碳排換算評估</p>
    </footer>

    <script>
        // 電力排碳係數資料庫 (kg CO2e / kWh)
        // 包含台灣近年官方公告或具代表性之排碳係數
        const emissionFactors = {
            "2024": { factor: 0.494, desc: "2024年電力排碳係數 (經濟部能源署公告)" },
            "2023": { factor: 0.495, desc: "2023年電力排碳係數 (經濟部能源署公告)" },
            "2022": { factor: 0.495, desc: "2022年電力排碳係數 (經濟部能源署公告)" },
            "2021": { factor: 0.509, desc: "2021年電力排碳係數 (經濟部能源署公告)" },
            "2020": { factor: 0.502, desc: "2020年電力排碳係數 (經濟部能源署公告)" },
            "2019": { factor: 0.509, desc: "2019年電力排碳係數 (經濟部能源署公告)" },
            "2018": { factor: 0.533, desc: "2018年電力排碳係數 (經濟部能源署公告)" }
        };

        // 示範資料 (模擬一般家庭或小型辦公室全年用電習慣，夏季冷氣用電較高)
        const demoData = [450, 420, 380, 400, 520, 780, 950, 920, 680, 430, 390, 440];

        // 12 個月份名稱
        const months = [
            "1月", "2月", "3月", "4月", "5月", "6月", 
            "7月", "8月", "9月", "10月", "11月", "12月"
        ];

        let carbonChart = null;

        // 初始化應用程式
        document.addEventListener('DOMContentLoaded', () => {
            initYearSelect();
            initInputs();
            initChart();
            updateDashboard();

            // 綁定事件監聽器
            document.getElementById('yearSelect').addEventListener('change', updateDashboard);
            document.getElementById('loadDemoBtn').addEventListener('click', loadDemoData);
            document.getElementById('resetBtn').addEventListener('click', resetData);
        });

        // 填入年份選單
        function initYearSelect() {
            const select = document.getElementById('yearSelect');
            select.innerHTML = '';
            for (const [year, data] of Object.entries(emissionFactors)) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = `${year} 年 (${data.factor} kg CO₂e/kWh)`;
                select.appendChild(option);
            }
            updateCoefficientInfo();
            select.addEventListener('change', updateCoefficientInfo);
        }

        // 更新係數說明文字
        function updateCoefficientInfo() {
            const year = document.getElementById('yearSelect').value;
            const infoSpan = document.querySelector('#coefficientInfo span');
            if (emissionFactors[year]) {
                infoSpan.textContent = `${emissionFactors[year].desc} - 當前係數：${emissionFactors[year].factor} kg CO₂e/kWh`;
            }
        }

        // 產生 12 個月份的輸入欄位
        function initInputs() {
            const container = document.getElementById('inputsContainer');
            container.innerHTML = '';
            
            months.forEach((month, index) => {
                const div = document.createElement('div');
                div.className = "flex flex-col bg-slate-50 p-2.5 rounded-xl border border-slate-200/80 hover:border-emerald-300 transition";
                div.innerHTML = `
                    <label for="month_${index}" class="text-xs font-semibold text-slate-600 mb-1 flex justify-between">
                        <span>${month}</span>
                        <span class="text-[10px] text-slate-400 font-normal">用電量</span>
                    </label>
                    <div class="relative flex items-center">
                        <input type="number" id="month_${index}" min="0" value="0" 
                            class="w-full bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
                            oninput="updateDashboard()">
                        <span class="absolute right-2 text-xs text-slate-400 pointer-events-none">度</span>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // 初始化 Chart.js 折線圖
        function initChart() {
            const ctx = document.getElementById('carbonChart').getContext('2d');
            carbonChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: months,
                    datasets: [{
                        label: '碳排放量 (kg CO₂e)',
                        data: new Array(12).fill(0),
                        borderColor: '#059669',
                        backgroundColor: 'rgba(5, 150, 105, 0.08)',
                        borderWidth: 2.5,
                        pointBackgroundColor: '#059669',
                        pointBorderColor: '#ffffff',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleFont: { family: 'Inter', size: 13, weight: '600' },
                            bodyFont: { family: 'Inter', size: 12 },
                            padding: 10,
                            cornerRadius: 8,
                            callbacks: {
                                label: function(context) {
                                    return ` 碳排放量: ${context.parsed.y.toLocaleString()} kg CO₂e`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(226, 232, 240, 0.6)'
                            },
                            ticks: {
                                font: { family: 'Inter', size: 11 },
                                color: '#64748b'
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                font: { family: 'Inter', size: 11 },
                                color: '#64748b'
                            }
                        }
                    }
                }
            });
        }

        // 一鍵載入示範資料
        function loadDemoData() {
            demoData.forEach((val, index) => {
                const input = document.getElementById(`month_${index}`);
                if (input) {
                    input.value = val;
                }
            });
            updateDashboard();
        }

        // 清空重設資料
        function resetData() {
            for (let i = 0; i < 12; i++) {
                const input = document.getElementById(`month_${i}`);
                if (input) {
                    input.value = 0;
                }
            }
            updateDashboard();
        }

        // 核心更新計算與圖表函數
        function updateDashboard() {
            const selectedYear = document.getElementById('yearSelect').value;
            const factor = emissionFactors[selectedYear] ? emissionFactors[selectedYear].factor : 0.495;

            let totalKwh = 0;
            let monthlyCarbonData = [];

            for (let i = 0; i < 12; i++) {
                const input = document.getElementById(`month_${i}`);
                const kwh = input && input.value !== '' ? parseFloat(input.value) : 0;
                const carbon = kwh * factor;
                
                totalKwh += kwh;
                monthlyCarbonData.push(parseFloat(carbon.toFixed(2)));
            }

            const totalCarbon = totalKwh * factor;
            const totalCarbonTon = totalCarbon / 1000;
            const avgCarbon = totalCarbon / 12;
            const avgKwh = totalKwh / 12;

            // 更新數據面板顯示
            document.getElementById('totalKwh').textContent = totalKwh.toLocaleString();
            document.getElementById('totalCarbon').textContent = totalCarbon.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            document.getElementById('totalCarbonTon').textContent = totalCarbonTon.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            document.getElementById('avgCarbon').textContent = avgCarbon.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            document.getElementById('avgKwh').textContent = avgKwh.toLocaleString(undefined, { maximumFractionDigits: 1 });

            // 更新圖表數據
            if (carbonChart) {
                carbonChart.data.datasets[0].data = monthlyCarbonData;
                carbonChart.update();
            }
        }
    </script>
</body>
</html>
