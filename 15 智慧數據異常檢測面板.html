<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧數據異常檢測面板</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-lg flex items-center justify-center">
                    <i class="fa-solid fa-chart-line text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">智慧數據異常檢測面板</h1>
                    <p class="text-xs text-slate-400">自動掃描 12 個月活動數據，標註偏差超過 ±25% 的月份</p>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <button onclick="loadDemoData()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-2 rounded-lg shadow transition flex items-center space-x-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>一鍵載入示範資料</span>
                </button>
                <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium px-4 py-2 rounded-lg border border-slate-700 cursor-pointer transition flex items-center space-x-2">
                    <i class="fa-solid fa-file-arrow-up"></i>
                    <span>匯入資料 (CSV/JSON)</span>
                    <input type="file" id="fileInput" accept=".csv, .json" class="hidden" onchange="handleFileUpload(event)">
                </label>
                <button onclick="exportData()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium px-4 py-2 rounded-lg border border-slate-700 transition flex items-center space-x-2">
                    <i class="fa-solid fa-file-arrow-down"></i>
                    <span>匯出報告</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left 2 Columns: Analytics & Chart -->
        <div class="lg:col-span-2 space-y-6">
            <!-- KPI Summary Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
                    <div>
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">全年總數據</p>
                        <h3 id="kpiTotal" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                    </div>
                    <div class="mt-4 flex items-center text-xs text-slate-500">
                        <i class="fa-solid fa-calculator mr-1.5 text-indigo-500"></i> 12 個月累計加總
                    </div>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
                    <div>
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">月平均數據</p>
                        <h3 id="kpiAverage" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                    </div>
                    <div class="mt-4 flex items-center text-xs text-slate-500">
                        <i class="fa-solid fa-chart-pie mr-1.5 text-indigo-500"></i> 基準平均線
                    </div>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
                    <div>
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">檢測到異常月份</p>
                        <h3 id="kpiAnomalies" class="text-2xl font-bold text-rose-600 mt-1">0</h3>
                    </div>
                    <div class="mt-4 flex items-center text-xs text-rose-500 font-medium">
                        <i class="fa-solid fa-triangle-exclamation mr-1.5"></i> 偏差超過 ±25%
                    </div>
                </div>
            </div>

            <!-- Chart Section -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-base font-bold text-slate-800 flex items-center">
                        <i class="fa-solid fa-chart-column mr-2 text-indigo-600"></i> 12 個月活動數據趨勢與異常標示
                    </h2>
                    <span class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full font-medium">
                        閥值: 平均值 ±25%
                    </span>
                </div>
                <div class="relative h-80 w-full">
                    <canvas id="anomalyChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Right Column: Data Table & Management -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-bold text-slate-800 flex items-center">
                    <i class="fa-solid fa-table-list mr-2 text-indigo-600"></i> 每月明細與原因記錄
                </h2>
                <span id="recordCount" class="text-xs text-slate-400">12 筆資料</span>
            </div>

            <!-- Month Table Container -->
            <div class="flex-grow overflow-y-auto max-h-[500px] border border-slate-100 rounded-xl">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 sticky top-0 z-10 text-xs font-semibold text-slate-500 uppercase border-b border-slate-200">
                        <tr>
                            <th class="p-3">月份</th>
                            <th class="p-3">數值</th>
                            <th class="p-3">狀態</th>
                            <th class="p-3 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody" class="divide-y divide-slate-100 text-sm">
                        <!-- Dynamic rows populated by JS -->
                    </tbody>
                </table>
            </div>

            <!-- Manual Editor Hint -->
            <div class="mt-4 pt-4 border-t border-slate-100 text-xs text-slate-500 flex items-center justify-between">
                <span>點擊「填寫原因」可記錄異常說明</span>
                <button onclick="resetData()" class="text-rose-600 hover:underline font-medium">重設資料</button>
            </div>
        </div>
    </main>

    <div id="reasonModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full mx-4 p-6 transform scale-95 transition-transform duration-300" id="modalContainer">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-800 flex items-center">
                    <i class="fa-solid fa-comment-dots text-indigo-600 mr-2"></i> 填寫異常原因
                </h3>
                <button onclick="closeReasonModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="mb-4 bg-slate-50 p-3 rounded-xl border border-slate-100 space-y-1">
                <div class="flex justify-between text-xs text-slate-500">
                    <span>目標月份: <strong id="modalMonth" class="text-slate-800"></strong></span>
                    <span>數值: <strong id="modalValue" class="text-slate-800"></strong></span>
                </div>
                <div class="flex justify-between text-xs text-slate-500">
                    <span>月平均: <strong id="modalAvg" class="text-slate-800"></strong></span>
                    <span>偏差率: <strong id="modalDeviation" class="text-rose-600"></strong></span>
                </div>
            </div>

            <form onsubmit="saveReason(event)">
                <input type="hidden" id="modalMonthIndex">
                <label class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase">異常原因與說明</label>
                <textarea id="modalReasonInput" rows="4" class="w-full rounded-xl border border-slate-200 p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-700" placeholder="請填寫此月份數值異常偏高或偏低的原因 (例如: 促銷活動大檔、系統故障、假期效應等)..." required></textarea>
                
                <div class="mt-5 flex justify-end space-x-3">
                    <button type="button" onclick="closeReasonModal()" class="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 text-sm font-medium transition">取消</button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium shadow transition">儲存原因</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg flex items-center space-x-3 text-sm">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMessage">操作成功</span>
    </div>

    <script>
        // Initial 12 months dataset structure
        let monthsData = [
            { month: "1月", value: 1200, reason: "" },
            { month: "2月", value: 1150, reason: "" },
            { month: "3月", value: 1300, reason: "" },
            { month: "4月", value: 1250, reason: "" },
            { month: "5月", value: 2400, reason: "" }, // Anomaly High (> +25%)
            { month: "6月", value: 1350, reason: "" },
            { month: "7月", value: 1400, reason: "" },
            { month: "8月", value: 1280, reason: "" },
            { month: "9月", value: 1320, reason: "" },
            { month: "10月", value: 1450, reason: "" },
            { month: "11月", value: 3100, reason: "" }, // Anomaly High (> +25%)
            { month: "12月", value: 450, reason: "" }   // Anomaly Low (< -25%)
        ];

        let anomalyChartInstance = null;

        // Initialize App on Load
        window.onload = function() {
            analyzeData();
            renderTable();
            renderChart();
        };

        // One-Click Demo Data Loader
        function loadDemoData() {
            monthsData = [
                { month: "1月", value: 1200, reason: "新年假期過後，需求平穩" },
                { month: "2月", value: 850, reason: "工作天數較少，活動量下降" },
                { month: "3月", value: 1350, reason: "春季檔期回暖" },
                { month: "4月", value: 1280, reason: "正常營運" },
                { month: "5月", value: 2850, reason: "母親節特大型促銷活動，創歷史新高" },
                { month: "6月", value: 1400, reason: "端午連假促銷" },
                { month: "7月", value: 1450, reason: "暑假檔期開始" },
                { month: "8月", value: 1300, reason: "正常營運" },
                { month: "9月", value: 1200, reason: "開學季活動" },
                { month: "10月", value: 1500, reason: "週年慶暖身" },
                { month: "11月", value: 3400, reason: "雙11年度網購狂歡節，爆發性增長" },
                { month: "12月", value: 500, reason: "後端系統伺服器維護中斷 3 天導致數據偏低" }
            ];
            analyzeData();
            renderTable();
            renderChart();
            showToast("已成功載入示範 12 個月活動數據！", "success");
        }

        // Reset Data
        function resetData() {
            monthsData = monthsData.map(item => ({ ...item, reason: "" }));
            analyzeData();
            renderTable();
            renderChart();
            showToast("數據已重設清除原因紀錄", "info");
        }

        // Core Anomaly Analysis Engine
        function analyzeData() {
            const values = monthsData.map(d => d.value);
            const total = values.reduce((sum, val) => sum + val, 0);
            const average = total / values.length;

            // Compute deviation for each month and flag anomalies (> 25% deviation)
            monthsData.forEach(item => {
                item.diff = item.value - average;
                item.percentDev = average === 0 ? 0 : (item.diff / average) * 100;
                item.isAnomaly = Math.abs(item.percentDev) > 25;
            });

            // Update KPIs
            document.getElementById("kpiTotal").innerText = total.toLocaleString();
            document.getElementById("kpiAverage").innerText = Math.round(average).toLocaleString();
            const anomalyCount = monthsData.filter(d => d.isAnomaly).length;
            document.getElementById("kpiAnomalies").innerText = anomalyCount;
        }

        // Calculate average dynamically for checks
        function getAverage() {
            const values = monthsData.map(d => d.value);
            return values.reduce((sum, val) => sum + val, 0) / values.length;
        }

        // Render Table Body
        function renderTable() {
            const tbody = document.getElementById("dataTableBody");
            tbody.innerHTML = "";

            monthsData.forEach((item, index) => {
                const tr = document.createElement("tr");
                tr.className = item.isAnomaly ? "bg-rose-50/60 hover:bg-rose-50 transition" : "hover:bg-slate-50 transition";
                
                let badgeHTML = `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">正常</span>`;
                if (item.isAnomaly) {
                    const devText = item.percentDev > 0 ? `+${item.percentDev.toFixed(1)}%` : `${item.percentDev.toFixed(1)}%`;
                    badgeHTML = `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-100 text-rose-700"><i class="fa-solid fa-triangle-exclamation mr-1"></i>異常 (${devText})</span>`;
                }

                let reasonBtnHTML = '';
                if (item.isAnomaly) {
                    if (item.reason) {
                        reasonBtnHTML = `<button onclick="openReasonModal(${index})" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium bg-indigo-50 px-2.5 py-1 rounded-lg border border-indigo-200" title="${item.reason}">已填寫原因</button>`;
                    } else {
                        reasonBtnHTML = `<button onclick="openReasonModal(${index})" class="text-xs text-white bg-rose-600 hover:bg-rose-500 font-medium px-3 py-1 rounded-lg shadow-sm animate-pulse">填寫原因</button>`;
                    }
                } else {
                    reasonBtnHTML = `<button onclick="openReasonModal(${index})" class="text-xs text-slate-500 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 px-2 py-1 rounded-lg">備註說明</button>`;
                }

                tr.innerHTML = `
                    <td class="p-3 font-medium text-slate-800">${item.month}</td>
                    <td class="p-3 font-semibold text-slate-700">${item.value.toLocaleString()}</td>
                    <td class="p-3">${badgeHTML}</td>
                    <td class="p-3 text-right">${reasonBtnHTML}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Render Chart using Chart.js
        function renderChart() {
            const ctx = document.getElementById("anomalyChart").getContext("2d");
            const labels = monthsData.map(d => d.month);
            const dataValues = monthsData.map(d => d.value);
            const avg = getAverage();
            const avgLineData = Array(monthsData.length).fill(Math.round(avg));

            // Custom colors for bars based on anomaly status
            const barColors = monthsData.map(d => d.isAnomaly ? 'rgba(225, 29, 72, 0.85)' : 'rgba(99, 102, 241, 0.75)');
            const borderColors = monthsData.map(d => d.isAnomaly ? 'rgb(190, 18, 60)' : 'rgb(79, 70, 229)');

            if (anomalyChartInstance) {
                anomalyChartInstance.destroy();
            }

            anomalyChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '活動數據',
                            data: dataValues,
                            backgroundColor: barColors,
                            borderColor: borderColors,
                            borderWidth: 1.5,
                            borderRadius: 8,
                            order: 2
                        },
                        {
                            label: '平均值基準線',
                            data: avgLineData,
                            type: 'line',
                            borderColor: 'rgba(234, 179, 8, 0.9)',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            pointRadius: 0,
                            order: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { font: { family: 'Inter', size: 12 } }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) label += ': ';
                                    if (context.parsed.y !== null) {
                                        label += context.parsed.y.toLocaleString();
                                    }
                                    const index = context.dataIndex;
                                    const item = monthsData[index];
                                    if (item.isAnomaly) {
                                        label += ` (異常偏差: ${item.percentDev > 0 ? '+' : ''}${item.percentDev.toFixed(1)}%)`;
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(241, 245, 249, 1)' }
                        },
                        x: {
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        // Modal Controls
        function openReasonModal(index) {
            const item = monthsData[index];
            const avg = getAverage();
            
            document.getElementById("modalMonthIndex").value = index;
            document.getElementById("modalMonth").innerText = item.month;
            document.getElementById("modalValue").innerText = item.value.toLocaleString();
            document.getElementById("modalAvg").innerText = Math.round(avg).toLocaleString();
            
            const devStr = item.percentDev > 0 ? `+${item.percentDev.toFixed(1)}%` : `${item.percentDev.toFixed(1)}%`;
            document.getElementById("modalDeviation").innerText = devStr;
            document.getElementById("modalReasonInput").value = item.reason || "";

            const modal = document.getElementById("reasonModal");
            const container = document.getElementById("modalContainer");
            modal.classList.remove("hidden");
            setTimeout(() => {
                modal.classList.remove("opacity-0");
                container.classList.remove("scale-95");
                container.classList.add("scale-100");
            }, 10);
        }

        function closeReasonModal() {
            const modal = document.getElementById("reasonModal");
            const container = document.getElementById("modalContainer");
            modal.classList.add("opacity-0");
            container.classList.remove("scale-100");
            container.classList.add("scale-95");
            setTimeout(() => {
                modal.classList.add("hidden");
            }, 300);
        }

        function saveReason(event) {
            event.preventDefault();
            const index = parseInt(document.getElementById("modalMonthIndex").value);
            const reasonText = document.getElementById("modalReasonInput").value;

            monthsData[index].reason = reasonText;
            closeReasonModal();
            renderTable();
            showToast(`已成功更新 ${monthsData[index].month} 的異常原因記錄`, "success");
        }

        // File Upload Handling (CSV or JSON)
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                if (file.name.endsWith('.json')) {
                    try {
                        const parsed = JSON.parse(content);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            monthsData = parsed;
                            analyzeData();
                            renderTable();
                            renderChart();
                            showToast("JSON 檔案成功匯入！", "success");
                        } else {
                            showToast("JSON 格式不符預期", "error");
                        }
                    } catch (err) {
                        showToast("解析 JSON 失敗", "error");
                    }
                } else if (file.name.endsWith('.csv')) {
                    try {
                        const lines = content.split('\n');
                        const newMonths = [];
                        for (let i = 1; i < lines.length; i++) {
                            const line = lines[i].trim();
                            if (!line) continue;
                            const parts = line.split(',');
                            if (parts.length >= 2) {
                                newMonths.push({
                                    month: parts[0].trim(),
                                    value: parseFloat(parts[1].trim()) || 0,
                                    reason: parts[2] ? parts[2].trim().replace(/^"|"$/g, '') : ""
                                });
                            }
                        }
                        if (newMonths.length > 0) {
                            monthsData = newMonths;
                            analyzeData();
                            renderTable();
                            renderChart();
                            showToast("CSV 檔案成功匯入！", "success");
                        } else {
                            showToast("CSV 內容無效", "error");
                        }
                    } catch (err) {
                        showToast("解析 CSV 失敗", "error");
                    }
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // reset file input
        }

        // Export Data Report
        function exportData() {
            let csvContent = "data:text/csv;charset=utf-8,月份,數值,偏差狀態,偏差率(%),異常原因\n";
            const avg = getAverage();
            monthsData.forEach(item => {
                const dev = avg === 0 ? 0 : ((item.value - avg) / avg * 100).toFixed(1) + '%';
                const status = item.isAnomaly ? '異常' : '正常';
                const safeReason = `"${(item.reason || '').replace(/"/g, '""')}"`;
                csvContent += `${item.month},${item.value},${status},${dev},${safeReason}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "activity_anomaly_report.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("報表匯出成功！", "success");
        }

        // Toast Notification Function
        function showToast(message, type = 'success') {
            const toast = document.getElementById("toast");
            const toastMessage = document.getElementById("toastMessage");
            const toastIcon = document.getElementById("toastIcon");

            toastMessage.innerText = message;
            if (type === 'success') {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
            } else if (type === 'info') {
                toastIcon.className = "fa-solid fa-circle-info text-sky-400";
            } else {
                toastIcon.className = "fa-solid fa-triangle-exclamation text-rose-400";
            }

            toast.classList.remove("translate-y-20", "opacity-0");
            setTimeout(() => {
                toast.classList.add("translate-y-20", "opacity-0");
            }, 3000);
        }
    </script>
</body>
</html>
